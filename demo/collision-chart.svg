<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="chartShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Chart Header -->
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Portland Vision Zero: Annual Traffic Collisions (20202025)</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Reported serious injury and fatality incidents across citywide arterial corridors</text>

  <!-- Y-Axis Grid Lines & Labels -->
  <!-- Max Y: 5,000 (y = 110). 4,000 (y = 170). 3,000 (y = 230). 2,000 (y = 290). 1,000 (y = 350). 0 (y = 410) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="110" x2="740" y2="110"/>
    <line x1="100" y1="170" x2="740" y2="170"/>
    <line x1="100" y1="230" x2="740" y2="230"/>
    <line x1="100" y1="290" x2="740" y2="290"/>
    <line x1="100" y1="350" x2="740" y2="350"/>
    <line x1="100" y1="410" x2="740" y2="410"/>
  </g>

  <!-- Y-Axis Labels -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">
    <text x="90" y="115">5,000</text>
    <text x="90" y="175">4,000</text>
    <text x="90" y="235">3,000</text>
    <text x="90" y="295">2,000</text>
    <text x="90" y="355">1,000</text>
    <text x="90" y="415">0</text>
  </g>
  <text x="35" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569" transform="rotate(-90 35 260)" text-anchor="middle">Annual Collisions</text>

  <!-- X-Axis Labels (Years: 2020 to 2025) -->
  <!-- X positions: 2020=160, 2021=270, 2022=380, 2023=490, 2024=600, 2025=710 -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">
    <text x="160" y="435">2020</text>
    <text x="270" y="435">2021</text>
    <text x="380" y="435">2022 (Worst)</text>
    <text x="490" y="435">2023</text>
    <text x="600" y="435">2024</text>
    <text x="710" y="435">2025 (Lowest)</text>
  </g>

  <!-- Area under curve -->
  <!-- 2020: 3,200 -> y = 410 - (3200/5000)*300 = 218 -->
  <!-- 2021: 4,100 -> y = 410 - (4100/5000)*300 = 164 -->
  <!-- 2022: 4,850 -> y = 410 - (4850/5000)*300 = 119 -->
  <!-- 2023: 3,900 -> y = 410 - (3900/5000)*300 = 176 -->
  <!-- 2024: 2,950 -> y = 410 - (2950/5000)*300 = 233 -->
  <!-- 2025: 2,200 -> y = 410 - (2200/5000)*300 = 278 -->
  <path d="M 160 218 L 270 164 L 380 119 L 490 176 L 600 233 L 710 278 L 710 410 L 160 410 Z" fill="url(#areaGrad)"/>

  <!-- Trend Line -->
  <path d="M 160 218 L 270 164 L 380 119 L 490 176 L 600 233 L 710 278" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data Point Circles and Value Callouts -->
  <!-- 2020: 3,200 -->
  <circle cx="160" cy="218" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <rect x="135" y="190" width="50" height="20" rx="3" fill="#f1f5f9"/>
  <text x="160" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">3,200</text>

  <!-- 2021: 4,100 -->
  <circle cx="270" cy="164" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <rect x="245" y="136" width="50" height="20" rx="3" fill="#f1f5f9"/>
  <text x="270" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">4,100</text>

  <!-- 2022: 4,850 (Worst Year Peak) -->
  <circle cx="380" cy="119" r="8" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>
  <rect x="330" y="78" width="100" height="32" rx="4" fill="#b91c1c" filter="url(#chartShadow)"/>
  <text x="380" y="94" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PEAK: 4,850</text>
  <text x="380" y="106" font-family="Arial, sans-serif" font-size="9" fill="#fecaca" text-anchor="middle">Worst Year</text>

  <!-- 2023: 3,900 -->
  <circle cx="490" cy="176" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <rect x="465" y="148" width="50" height="20" rx="3" fill="#f1f5f9"/>
  <text x="490" y="162" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">3,900</text>

  <!-- 2024: 2,950 -->
  <circle cx="600" cy="233" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <rect x="575" y="205" width="50" height="20" rx="3" fill="#f1f5f9"/>
  <text x="600" y="219" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">2,950</text>

  <!-- 2025: 2,200 (Lowest Year) -->
  <circle cx="710" cy="278" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <rect x="655" y="295" width="110" height="32" rx="4" fill="#15803d" filter="url(#chartShadow)"/>
  <text x="710" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">LOW: 2,200</text>
  <text x="710" y="323" font-family="Arial, sans-serif" font-size="9" fill="#bbf7d0" text-anchor="middle">-55% since 2022</text>

  <!-- Policy Intervention Callout Box -->
  <rect x="440" y="360" width="280" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="455" y="377" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">¡ 2023 Intervention:</text>
  <text x="455" y="393" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Automated speed radar cameras + green lanes installed</text>
</svg>
